apiVersion: apps/v1
kind: Deployment
metadata:
  name: numa-dns
  labels:
    app: numa-dns
  annotations:
    secret.reloader.stakater.com/reload: numa-doh-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numa-dns
  template:
    metadata:
      labels:
        app: numa-dns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: numa-dns
          image: ghcr.io/razvandimescu/numa:0.25.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/numa-config/numa.toml
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 15
            periodSeconds: 20
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: api-http
              containerPort: 5380
              protocol: TCP
            - name: doh-tls
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/numa-config
              readOnly: true
            - name: data
              mountPath: /var/lib/numa
            - name: tls
              mountPath: /etc/numa-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: numa-config
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: numa-doh-tls
            # Keep DNS53 available while cert-manager issues the first certificate.
            optional: true
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: numa-dns
  labels:
    app: numa-dns
spec:
  type: ClusterIP
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: api-http
      port: 5380
      protocol: TCP
      targetPort: api-http
    - name: doh-tls
      port: 443
      protocol: TCP
      targetPort: doh-tls
  selector:
    app: numa-dns
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-numa-ingress
spec:
  podSelector:
    matchLabels:
      app: numa-dns
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-numa-egress
spec:
  podSelector:
    matchLabels:
      app: numa-dns
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-numa-dns
spec:
  podSelector:
    matchLabels:
      app: numa-dns
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 192.168.2.0/24
        - ipBlock:
            cidr: 192.168.5.0/24
        - ipBlock:
            cidr: 192.168.10.0/24
        - ipBlock:
            cidr: 192.168.20.0/24
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 1.1.1.1/32
        - ipBlock:
            cidr: 9.9.9.9/32
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-numa-dns-from-world
spec:
  endpointSelector:
    matchLabels:
      app: numa-dns
  # shortcut: Cilium sees SNATed LoadBalancer clients as world; revisit if source preservation changes.
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-numa-dashboard-and-doh
spec:
  endpointSelector:
    matchLabels:
      app: numa-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: cloudflared
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5380"
              protocol: TCP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: numa-doh
spec:
  secretName: numa-doh-tls
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-prod
  duration: 2160h0m0s
  renewBefore: 720h0m0s
  dnsNames:
    - dns.nidr0x.win
