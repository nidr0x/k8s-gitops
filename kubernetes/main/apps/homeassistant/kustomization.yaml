apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
configMapGenerator:
  - name: homeassistant-visionos-theme
    files:
      - visionos.yaml=themes/visionos.yaml
      - liquid-glass.yaml=themes/liquid-glass.yaml
      - visionos_default.yaml=packages/visionos_default.yaml
  - name: homeassistant-localthings-installer
    files:
      - install_localthings.py=localthings/install.py
resources:
  - namespace.yaml
  - database.yaml
  - secret.yaml
  - pv.yaml
  - pvc.yaml
  - deployment.yaml
  - matter-server.yaml
  - http-route.yaml
  - network-policies.yaml
  - policy-exception.yaml
  - service.yaml
  - pdb.yaml
  - configmap.yaml
