apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  labels:
    app: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      # Matter-over-Thread relies on LAN mDNS advertisements and discovery.
      hostNetwork: true
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fetch-fp300-ota
          image: ghcr.io/matter-js/matterjs-server:stable@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          command: ["node", "-e"]
          args:
            - |
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              (async () => {
                try {
                  const response = await fetch(process.env.OTA_URL, { signal: AbortSignal.timeout(30_000) });
                  if (!response.ok) throw new Error(`Firmware download failed: HTTP ${response.status}`);
                  const firmware = Buffer.from(await response.arrayBuffer());
                  if (firmware.length !== 1183324) throw new Error(`Unexpected firmware size: ${firmware.length}`);
                  const sha256 = crypto.createHash("sha256").update(firmware).digest("hex");
                  if (sha256 !== "7b710d3972bdb20c0ae6b0c5a56748a11528586d1badb14d43d231ec8568657c") throw new Error(`Firmware SHA-256 mismatch: ${sha256}`);
                  fs.writeFileSync("/ota/fp300.ota", firmware, { mode: 0o644 });
                  console.log("FP300 1.1.3.8 OTA image staged and verified.");
                } catch (error) {
                  console.error("FP300 OTA image was not staged; Matter Server will start without the custom image.", error);
                }
              })();
          env:
            - name: OTA_URL
              value: "https://media.githubusercontent.com/media/absent42/Aqara-Firmware-Archive/main/Presence%20Multi-Sensor%20FP300/aqara.matter.4447_8197/1.1.3.8/20260515152513_rel_enc_ota_app_smi_aqara.matter.4447_8197_1.1.3.8_202605150709_dc0bea.ota"
          volumeMounts:
            - name: ota-provider
              mountPath: /ota
      containers:
        - name: matter-server
          # renovate: datasource=docker depName=ghcr.io/matter-js/matterjs-server
          image: ghcr.io/matter-js/matterjs-server:stable@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          imagePullPolicy: IfNotPresent
          args:
            - --primary-interface
            - ens18
            - --enable-test-net-dcl
            - --ota-provider-dir
            - /ota
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          volumeMounts:
            - name: homeassistant-config
              mountPath: /data
              subPath: matter-server
            - name: ota-provider
              mountPath: /ota
          startupProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 5
      volumes:
        - name: ota-provider
          emptyDir: {}
        - name: homeassistant-config
          persistentVolumeClaim:
            claimName: homeassistant-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  labels:
    app: matter-server
spec:
  type: ClusterIP
  ports:
    - name: websocket
      port: 5580
      protocol: TCP
      targetPort: websocket
  selector:
    app: matter-server
