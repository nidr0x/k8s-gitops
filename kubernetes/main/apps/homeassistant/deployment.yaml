apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    alerts.nidr0x.win/enabled: "true"
  annotations:
    configmap.reloader.stakater.com/reload: homeassistant-configmap
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        alerts.nidr0x.win/enabled: "true"
    spec:
      # HomeKit requires LAN multicast discovery and a direct HAP TCP connection.
      hostNetwork: true
      # Keep Kubernetes service discovery available while using host networking.
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: install-theme
          image: homeassistant/home-assistant:2026.8
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              mkdir -p /config/themes /config/packages &&
              rm -f /config/packages/visionos-default.yaml &&
              cp /config/theme-source/everest.yaml /config/themes/everest.yaml &&
              cp /config/visionos-source/visionos.yaml /config/themes/visionos.yaml &&
              cp /config/visionos-source/liquid-glass.yaml /config/themes/liquid-glass.yaml &&
              cp /config/visionos-source/visionos_default.yaml /config/packages/visionos_default.yaml
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: homeassistant-config
              mountPath: /config
            - name: homeassistant-config-file
              mountPath: /config/theme-source/everest.yaml
              subPath: everest.yaml
            - name: homeassistant-visionos-theme
              mountPath: /config/visionos-source
        - name: check-config
          image: homeassistant/home-assistant:2026.8
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - homeassistant
            - --script
            - check_config
            - --config
            - /config
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: "Europe/Madrid"
            - name: HOMEASSISTANT_RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: homeassistant-database-app
                  key: uri
          volumeMounts:
            - name: homeassistant-config
              mountPath: /config
            - name: homeassistant-config-file
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
      containers:
        - name: homeassistant
          image: homeassistant/home-assistant:2026.8
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: "Europe/Madrid"
            - name: HOMEASSISTANT_RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: homeassistant-database-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - name: http
              protocol: TCP
              containerPort: 8123
          volumeMounts:
            - name: homeassistant-config
              mountPath: /config
            - name: homeassistant-config-file
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 3
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 30
      volumes:
        - name: homeassistant-config
          persistentVolumeClaim:
            claimName: homeassistant-config-pvc
        - name: homeassistant-config-file
          configMap:
            name: homeassistant-configmap
        - name: homeassistant-visionos-theme
          configMap:
            name: homeassistant-visionos-theme
