apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: homeassistant-host-network
  namespace: homeassistant
  annotations:
    policies.kyverno.io/description: >-
      Home Assistant and Matter require host networking for HomeKit, Matter-over-Thread,
      and LAN mDNS discovery. Keep this exception limited to these workloads.
spec:
  policyRefs:
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
  matchConditions:
    - name: homeassistant-workloads
      expression: >-
        object.metadata.name == 'homeassistant' ||
        object.metadata.name.startsWith('homeassistant-') ||
        object.metadata.name == 'matter-server' ||
        object.metadata.name.startsWith('matter-server-')
