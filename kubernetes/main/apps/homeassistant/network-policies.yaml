apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homeassistant-to-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: homeassistant-database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: homeassistant
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-from-homeassistant-proxies
spec:
  endpointSelector:
    matchLabels:
      app: homeassistant
  ingress:
    # Remote Companion traffic arrives directly from the Cloudflared pods.
    - fromEndpoints:
        - matchLabels:
            k8s:app: cloudflared
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # LAN traffic using either Gateway API listener is represented by Cilium's
    # reserved ingress identity, not by the host-networked Envoy pod identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-homeassistant-to-matter-server
spec:
  endpointSelector:
    matchLabels:
      app: matter-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: homeassistant
            k8s:io.kubernetes.pod.namespace: homeassistant
      toPorts:
        - ports:
            - port: "5580"
              protocol: TCP
