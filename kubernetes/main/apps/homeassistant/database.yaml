apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homeassistant-database
  namespace: homeassistant
spec:
  env:
    - name: TZ
      value: UTC
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm

  postgresql:
    parameters:
      max_wal_size: "512MB"
      min_wal_size: "128MB"
      archive_timeout: "10min"
      checkpoint_timeout: "15min"
      checkpoint_completion_target: "0.9"
      wal_keep_size: "256MB"

  bootstrap:
    recovery:
      database: homeassistant
      owner: homeassistant
      source: homeassistant-database-origin

  externalClusters:
    - name: homeassistant-database-origin
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: homeassistant-database
          serverName: homeassistant-database-pg18

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: homeassistant-database-k2
        serverName: homeassistant-database-k2

  primaryUpdateStrategy: unsupervised

  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: proxmox-k2-zfs

  walStorage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: proxmox-k2-zfs

  monitoring:
    enablePodMonitor: false

  resources:
    requests:
      memory: "256Mi"
      cpu: "128m"
    limits:
      memory: "768Mi"
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: homeassistant-database
  namespace: homeassistant
spec:
  configuration:
    destinationPath: s3://nidr0x-homelab-backups/cloudnative-pg
    endpointURL: https://de6356c843cfe00a0c3ff3b669892ca9.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: homeassistant-database
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: homeassistant-database
        key: SECRET_ACCESS_KEY
    data:
      compression: bzip2
      encryption: AES256
    wal:
      compression: bzip2
      maxParallel: 4
      encryption: AES256
  retentionPolicy: "7d"
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: homeassistant-database-k2
  namespace: homeassistant
spec:
  configuration:
    destinationPath: s3://nidr0x-homelab-backups/cloudnative-pg
    endpointURL: https://de6356c843cfe00a0c3ff3b669892ca9.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: homeassistant-database
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: homeassistant-database
        key: SECRET_ACCESS_KEY
    data:
      compression: bzip2
      encryption: AES256
    wal:
      compression: bzip2
      maxParallel: 4
      encryption: AES256
  retentionPolicy: "7d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: homeassistant-backup
  namespace: homeassistant
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: homeassistant-database
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
