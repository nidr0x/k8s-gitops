apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-energy-package
  namespace: homeassistant
data:
  energy.yaml: |
    template:
      - sensor:
          - name: "Energía red i-DE acumulada"
            unique_id: everest_energia_red_ide_acumulada
            default_entity_id: sensor.energia_red_ide_acumulada
            unit_of_measurement: "kWh"
            device_class: energy
            state_class: total_increasing
            availability: "{{ is_number(states('sensor.es0021000043017330yj_accumulated_consumption')) }}"
            state: "{{ states('sensor.es0021000043017330yj_accumulated_consumption') | float(0) }}"
          - name: "Energía luz piscina acumulada"
            unique_id: everest_energia_circuito_shelly_acumulada
            default_entity_id: sensor.energia_circuito_shelly_acumulada
            unit_of_measurement: "kWh"
            device_class: energy
            state_class: total_increasing
            availability: "{{ is_number(states('sensor.shelly1pmminig4_e4b06360bdc0_energy')) }}"
            state: "{{ states('sensor.shelly1pmminig4_e4b06360bdc0_energy') | float(0) }}"
          - name: "Energía coche Tesla acumulada"
            unique_id: everest_energia_coche_tesla_acumulada
            default_entity_id: sensor.energia_coche_tesla_acumulada
            unit_of_measurement: "kWh"
            device_class: energy
            state_class: total_increasing
            availability: "{{ is_number(states('sensor.tesla_wall_connector_energy')) }}"
            state: "{{ states('sensor.tesla_wall_connector_energy') | float(0) }}"
          - name: "Energía nevera acumulada"
            unique_id: everest_energia_nevera_acumulada
            default_entity_id: sensor.energia_nevera_acumulada
            unit_of_measurement: "kWh"
            device_class: energy
            state_class: total_increasing
            availability: "{{ is_number(states('sensor.samsung_refrigerator_tp1x_ref_25k_energy_2')) }}"
            state: "{{ states('sensor.samsung_refrigerator_tp1x_ref_25k_energy_2') | float(0) }}"
          - name: "Energía congelador acumulada"
            unique_id: everest_energia_congelador_acumulada
            default_entity_id: sensor.energia_congelador_acumulada
            unit_of_measurement: "kWh"
            device_class: energy
            state_class: total_increasing
            availability: "{{ is_number(states('sensor.samsung_refrigerator_tp1x_ref_25k_energy')) }}"
            state: "{{ states('sensor.samsung_refrigerator_tp1x_ref_25k_energy') | float(0) }}"
          - name: "Potencia circuito Shelly"
            unique_id: everest_potencia_circuito_shelly
            default_entity_id: sensor.potencia_circuito_shelly
            unit_of_measurement: "kW"
            device_class: power
            state_class: measurement
            availability: "{{ is_number(states('sensor.shelly1pmminig4_e4b06360bdc0_power')) }}"
            state: "{{ (states('sensor.shelly1pmminig4_e4b06360bdc0_power') | float(0) / 1000) | round(3) }}"
          - name: "Potencia coche Tesla"
            unique_id: everest_potencia_coche_tesla
            default_entity_id: sensor.potencia_coche_tesla
            unit_of_measurement: "kW"
            device_class: power
            state_class: measurement
            availability: "{{ is_number(states('sensor.tesla_wall_connector_total_power')) }}"
            state: "{{ states('sensor.tesla_wall_connector_total_power') | float(0) }}"
          - name: "Potencia nevera"
            unique_id: everest_potencia_nevera
            default_entity_id: sensor.potencia_nevera
            unit_of_measurement: "W"
            device_class: power
            state_class: measurement
            availability: "{{ is_number(states('sensor.samsung_refrigerator_tp1x_ref_25k_power_2')) }}"
            state: "{{ states('sensor.samsung_refrigerator_tp1x_ref_25k_power_2') | float(0) }}"
          - name: "Potencia congelador"
            unique_id: everest_potencia_congelador
            default_entity_id: sensor.potencia_congelador
            unit_of_measurement: "W"
            device_class: power
            state_class: measurement
            availability: "{{ is_number(states('sensor.samsung_refrigerator_tp1x_ref_25k_power')) }}"
            state: "{{ states('sensor.samsung_refrigerator_tp1x_ref_25k_power') | float(0) }}"

    utility_meter:
      energia_red_ide_diaria:
        source: sensor.energia_red_ide_acumulada
        cycle: daily
      energia_red_ide_mensual:
        source: sensor.energia_red_ide_acumulada
        cycle: monthly
      energia_luz_piscina_diaria:
        source: sensor.energia_circuito_shelly_acumulada
        cycle: daily
      energia_luz_piscina_mensual:
        source: sensor.energia_circuito_shelly_acumulada
        cycle: monthly
      energia_coche_tesla_diaria:
        source: sensor.energia_coche_tesla_acumulada
        cycle: daily
      energia_coche_tesla_mensual:
        source: sensor.energia_coche_tesla_acumulada
        cycle: monthly
