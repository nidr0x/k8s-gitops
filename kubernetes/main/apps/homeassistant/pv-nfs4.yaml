apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeassistant-config-nfs4
spec:
  capacity:
    storage: 768Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=4.1
    - tcp
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: homeassistant-config-nfs4
    volumeAttributes:
      server: 192.168.1.10
      share: /homelab
