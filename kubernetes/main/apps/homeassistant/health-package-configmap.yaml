apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-health-package
  namespace: homeassistant
data:
  health.yaml: |
    group:
      baterias_criticas:
        name: Baterías críticas
        entities:
          - binary_sensor.comedor_aqara_smart_lock_u200_bateria_critica_cerradura
          - binary_sensor.escaleras_habitaciones_sensor_ocupacion_escaleras_habitaciones_bateria_critica_sensor_escaleras

    template:
      - triggers:
          - trigger: homeassistant
            event: start
        sensor:
          - name: "Home Assistant último arranque"
            unique_id: everest_home_assistant_ultimo_arranque
            device_class: timestamp
            state: "{{ now().isoformat() }}"

      - binary_sensor:
          - name: "Backup automático obsoleto"
            unique_id: everest_backup_automatico_obsoleto
            device_class: problem
            state: >-
              {% set value = states('sensor.backup_last_successful_automatic_backup') %}
              {% if value in ['unknown', 'unavailable', ''] %}
                true
              {% else %}
                {{ (as_timestamp(now()) - as_timestamp(value)) > 86400 }}
              {% endif %}

          - name: "Cámaras no disponibles"
            unique_id: everest_camaras_no_disponibles
            device_class: problem
            state: >-
              {% set ns = namespace(found=false) %}
              {% for entity in states.camera %}
                {% if entity.state in ['unknown', 'unavailable'] %}
                  {% set ns.found = true %}
                {% endif %}
              {% endfor %}
              {{ ns.found }}

          - name: "Actualizaciones pendientes"
            unique_id: everest_actualizaciones_pendientes
            device_class: update
            state: >-
              {{ states.update | selectattr('state', 'eq', 'on') | list | count > 0 }}

          - name: "i-DE histórico sin datos"
            unique_id: everest_ide_historico_sin_datos
            device_class: problem
            state: >-
              {{ states('sensor.es0021000043017330yj_historical_consumption') in ['unknown', 'unavailable', ''] }}

          - name: "Home Assistant reinicio reciente"
            unique_id: everest_home_assistant_reinicio_reciente
            device_class: problem
            state: >-
              {% set value = states('sensor.home_assistant_ultimo_arranque') %}
              {% if value in ['unknown', 'unavailable', ''] %}
                false
              {% else %}
                {{ (as_timestamp(now()) - as_timestamp(value)) < 900 }}
              {% endif %}

          - name: "Entidades obligatorias no disponibles"
            unique_id: everest_entidades_obligatorias_no_disponibles
            default_entity_id: binary_sensor.entidades_obligatorias_no_disponibles
            device_class: problem
            state: >-
              {% set startup = states('sensor.home_assistant_ultimo_arranque') %}
              {% set grace_active = startup not in ['unknown', 'unavailable', ''] and
                (as_timestamp(now()) - as_timestamp(startup, 0)) < 600 %}
              {% set required = [
                'person.casa',
                'lock.aqara_smart_lock_u200',
                'camera.entrada_joan_fuster_5_high_resolution_channel',
                'camera.g5_turret_ultra_high_resolution_channel',
                'sensor.energia_red_ide_acumulada',
                'sensor.energia_circuito_shelly_acumulada',
                'sensor.energia_coche_tesla_acumulada',
                'sensor.potencia_circuito_shelly',
                'sensor.potencia_coche_tesla',
                'group.baterias_criticas'
              ] %}
              {% set ns = namespace(unavailable=false) %}
              {% for entity_id in required %}
                {% if states(entity_id) in ['unknown', 'unavailable'] %}
                  {% set ns.unavailable = true %}
                {% endif %}
              {% endfor %}
              {{ ns.unavailable and not grace_active }}
            attributes:
              unavailable_entities: >-
                {% set required = [
                  'person.casa',
                  'lock.aqara_smart_lock_u200',
                  'camera.entrada_joan_fuster_5_high_resolution_channel',
                  'camera.g5_turret_ultra_high_resolution_channel',
                  'sensor.energia_red_ide_acumulada',
                  'sensor.energia_circuito_shelly_acumulada',
                  'sensor.energia_coche_tesla_acumulada',
                  'sensor.potencia_circuito_shelly',
                  'sensor.potencia_coche_tesla',
                  'group.baterias_criticas'
                ] %}
                {% set ns = namespace(entities=[]) %}
                {% for entity_id in required %}
                  {% if states(entity_id) in ['unknown', 'unavailable'] %}
                    {% set ns.entities = ns.entities + [entity_id] %}
                  {% endif %}
                {% endfor %}
                {{ ns.entities | join(', ') if ns.entities else 'ninguna' }}
              unavailable_count: >-
                {% set required = [
                  'person.casa',
                  'lock.aqara_smart_lock_u200',
                  'camera.entrada_joan_fuster_5_high_resolution_channel',
                  'camera.g5_turret_ultra_high_resolution_channel',
                  'sensor.energia_red_ide_acumulada',
                  'sensor.energia_circuito_shelly_acumulada',
                  'sensor.energia_coche_tesla_acumulada',
                  'sensor.potencia_circuito_shelly',
                  'sensor.potencia_coche_tesla',
                  'group.baterias_criticas'
                ] %}
                {% set ns = namespace(count=0) %}
                {% for entity_id in required %}
                  {% if states(entity_id) in ['unknown', 'unavailable'] %}
                    {% set ns.count = ns.count + 1 %}
                  {% endif %}
                {% endfor %}
                {{ ns.count }}
              startup_grace_active: >-
                {% set startup = states('sensor.home_assistant_ultimo_arranque') %}
                {{ startup not in ['unknown', 'unavailable', ''] and
                   (as_timestamp(now()) - as_timestamp(startup, 0)) < 600 }}

    automation:
      - id: homeassistant_health_backup_obsoleto
        alias: Mantenimiento - Aviso de backup obsoleto
        description: Avisa si no hay un backup automático correcto en las últimas 24 horas.
        triggers:
          - trigger: state
            entity_id: binary_sensor.backup_automatico_obsoleto
            to: "on"
            for: "00:05:00"
        actions:
          - action: persistent_notification.create
            data:
              title: Mantenimiento - Backup obsoleto
              message: Home Assistant no tiene un backup automático correcto en las últimas 24 horas.
              notification_id: homeassistant_backup_obsoleto
        mode: single

      - id: homeassistant_health_camaras_no_disponibles
        alias: Mantenimiento - Cámara no disponible
        description: Avisa si una cámara permanece sin estado durante cinco minutos.
        triggers:
          - trigger: state
            entity_id: binary_sensor.camaras_no_disponibles
            to: "on"
            for: "00:05:00"
        actions:
          - action: persistent_notification.create
            data:
              title: Mantenimiento - Cámara no disponible
              message: Una o más cámaras llevan al menos cinco minutos sin estar disponibles.
              notification_id: homeassistant_camaras_no_disponibles
        mode: single

      - id: homeassistant_health_baterias_criticas
        alias: Mantenimiento - Batería crítica
        description: Avisa si una de las baterías monitorizadas baja del 15 por ciento.
        triggers:
          - trigger: state
            entity_id: group.baterias_criticas
            to: "on"
            for: "00:05:00"
        actions:
          - action: persistent_notification.create
            data:
              title: Mantenimiento - Batería crítica
              message: >-
                Una o más baterías monitorizadas están por debajo del 15 por ciento.
                Revisa el grupo Baterías críticas en Home Assistant.
              notification_id: homeassistant_baterias_criticas
        mode: single

      - id: homeassistant_health_entidades_obligatorias
        alias: Mantenimiento - Entidad obligatoria no disponible
        description: Avisa si una entidad necesaria para seguridad, energía o mantenimiento falta o no está disponible durante cinco minutos.
        triggers:
          - trigger: state
            entity_id: binary_sensor.entidades_obligatorias_no_disponibles
            to: "on"
            for: "00:05:00"
        actions:
          - action: persistent_notification.create
            data:
              title: Mantenimiento - Entidad obligatoria no disponible
              message: >-
                Falta o no está disponible una entidad necesaria para seguridad o energía.
                Revisa el dashboard Mantenimiento y la configuración de dispositivos.
              notification_id: homeassistant_entidades_obligatorias_no_disponibles
        mode: single

      - id: homeassistant_health_ide_historico_sin_datos
        alias: Mantenimiento - i-DE histórico sin datos
        description: Avisa si el sensor histórico de i-DE no tiene estados disponibles.
        triggers:
          - trigger: state
            entity_id: binary_sensor.i_de_historico_sin_datos
            to: "on"
            for: "00:05:00"
        actions:
          - action: persistent_notification.create
            data:
              title: Mantenimiento - i-DE histórico
              message: El sensor histórico de i-DE no tiene estados disponibles.
              notification_id: homeassistant_ide_historico_sin_datos
        mode: single
