apiVersion: v1
kind: PersistentVolume
metadata:
  name: transmission-nfs4
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 300Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=4.1
    - tcp
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: transmission-nfs4
    volumeAttributes:
      server: 192.168.1.10
      share: /homelab/transmission
