# The chart allows a single replica: concurrent instances would submit
# duplicate record changes to the provider.
replicaCount: 1

# Upsert-only keeps DNS records that are no longer rendered by a source.
# Deleting them automatically is a separate decision, so do not use "sync"
# until every record in the zone is known to be owned by external-dns.
policy: upsert-only

commonLabels:
  alerts.nidr0x.win/enabled: "true"

podLabels:
  alerts.nidr0x.win/enabled: "true"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: external-dns

resources:
  requests:
    memory: 100Mi
    cpu: 25m
  limits:
    memory: 200Mi
    cpu: 100m

sources:
  - ingress
  - gateway-httproute

provider: cloudflare

extraArgs:
  - --cloudflare-proxied
  - --annotation-filter=external-dns.alpha.kubernetes.io/target

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns
        key: CF_API_TOKEN
  - name: CF_API_EMAIL
    valueFrom:
      secretKeyRef:
        name: external-dns
        key: CF_API_EMAIL
