# The cluster runs Kyverno 1.20, where kyverno.io legacy policy types are not
# executed. The last legacy resources were migrated to policies.kyverno.io, so
# the chart's upgrade check runs again and blocks the release if one returns.
admissionController:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Allow only the Home Assistant namespace to declare narrowly scoped exceptions
# for workloads that genuinely require host networking for LAN discovery.
features:
  policyExceptions:
    enabled: true
    namespace: homeassistant

backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1
