# The cluster runs Kyverno 1.20, where kyverno.io legacy policy types are not
# executed at all. The four legacy resources this repository shipped are gone
# in this change: the certificate is read from cert-manager through a
# ReferenceGrant, and the remaining policies are CEL policies.
#
# The chart's upgrade hook still runs before the manifests that prune those
# objects, so acknowledge the gate for this sync. Remove this setting in a
# follow-up now that no legacy resource remains.
upgrade:
  acknowledgeLegacyPoliciesNotEnforced: true

admissionController:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Allow only the Home Assistant namespace to declare narrowly scoped exceptions
# for workloads that genuinely require host networking for LAN discovery.
features:
  policyExceptions:
    enabled: true
    namespace: homeassistant

backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1
