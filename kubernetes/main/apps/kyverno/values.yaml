# Kyverno 1.19.2 still evaluates the kyverno.io/v1 policies in this directory
# (the certificate clone keeps syncing), but the chart's upgrade hook refuses
# to finish the release until those resources move to policies.kyverno.io.
# Acknowledge the gate so Argo CD can complete the sync; the CEL migration of
# disallow-latest-tag, unique-ingress-host and sync-gateway-secret is tracked
# as separate work.
upgrade:
  acknowledgeLegacyPoliciesNotEnforced: true

admissionController:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Allow only the Home Assistant namespace to declare narrowly scoped exceptions
# for workloads that genuinely require host networking for LAN discovery.
features:
  policyExceptions:
    enabled: true
    namespace: homeassistant

backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1
