apiVersion: v1
kind: PersistentVolume
metadata:
  name: victorialogs-server-nfs4
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=4.1
    - tcp
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: victorialogs-server-nfs4
    volumeAttributes:
      server: 192.168.1.10
      share: /homelab/pvc-ceee346e-698b-449c-84c0-4fd76c2fc350
