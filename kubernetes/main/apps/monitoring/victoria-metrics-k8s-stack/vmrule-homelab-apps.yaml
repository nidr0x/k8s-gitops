apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-apps
spec:
  groups:
    - name: homelab-apps
      rules:
        - alert: HomeAssistantConfigBackupMissing
          annotations:
            description: The Home Assistant configuration CronJob has not completed successfully in the last 26 hours.
            summary: Home Assistant configuration backup is stale or missing.
          expr: |
            absent(
              kube_cronjob_status_last_successful_time{
                job="kube-state-metrics",
                namespace="homeassistant",
                cronjob="homeassistant-config-backup"
              }
            )
            or
            time() - kube_cronjob_status_last_successful_time{
              job="kube-state-metrics",
              namespace="homeassistant",
              cronjob="homeassistant-config-backup"
            } > 26 * 3600
          for: 15m
          labels:
            severity: critical
            scope: homelab-apps
        - alert: HomeAssistantConfigBackupFailed
          annotations:
            description: A recent Home Assistant configuration backup Job has failed and has not been followed by a successful run yet.
            summary: Home Assistant configuration backup failed.
          expr: |
            (
              max by (namespace, job_name) (
                kube_job_status_failed{
                  job="kube-state-metrics",
                  namespace="homeassistant",
                  job_name=~"homeassistant-config-backup-.*"
                }
              ) > 0
            )
            and on (namespace, job_name)
            (
              time() - kube_job_created{
                job="kube-state-metrics",
                namespace="homeassistant",
                job_name=~"homeassistant-config-backup-.*"
              } < 26 * 3600
            )
            and on (namespace, job_name)
            (
              kube_job_complete{
                job="kube-state-metrics",
                namespace="homeassistant",
                job_name=~"homeassistant-config-backup-.*",
                condition="true"
              } == 0
            )
          for: 5m
          labels:
            severity: warning
            scope: homelab-apps
        - alert: HomeAssistantCNPGBackupMissing
          annotations:
            description: No completed CNPG backup for the Home Assistant database has been recorded in the last 26 hours.
            summary: Home Assistant CNPG backup is stale or missing.
          expr: |
            absent(
              cnpg_backup_status_stopped_at{
                namespace="homeassistant",
                cluster="homeassistant-database"
              }
            )
            or
            time() - max by (namespace, cluster) (
              cnpg_backup_status_stopped_at{
                namespace="homeassistant",
                cluster="homeassistant-database"
              }
            ) > 26 * 3600
          for: 15m
          labels:
            severity: critical
            scope: homelab-apps
        - alert: HomeAssistantCNPGBackupFailed
          annotations:
            description: A recent CNPG backup for the Home Assistant database has entered the failed phase.
            summary: Home Assistant CNPG backup failed.
          expr: |
            cnpg_backup_status_phase{
              namespace="homeassistant",
              cluster="homeassistant-database",
              phase="failed"
            } == 1
            and on (namespace, name, cluster)
            (
              time() - cnpg_backup_metadata_created{
                namespace="homeassistant",
                cluster="homeassistant-database"
              } < 26 * 3600
            )
          for: 5m
          labels:
            severity: warning
            scope: homelab-apps
        - alert: HomeAssistantContainerOOMKilled
          record: ""
          annotations:
            description: Container {{ $labels.container }} in pod {{ $labels.pod }} in namespace {{ $labels.namespace }} was OOM-killed during the last 15 minutes.
            summary: Home Assistant container was OOM-killed.
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                job="kube-state-metrics",
                namespace="homeassistant",
                container=~"homeassistant|matter-server"
              }[15m]
            ) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{
              job="kube-state-metrics",
              namespace="homeassistant",
              container=~"homeassistant|matter-server",
              reason="OOMKilled"
            } == 1
          for: 1m
          labels:
            severity: critical
            scope: homelab-apps
        - alert: HomeAssistantContainerMemoryHigh
          record: ""
          annotations:
            description: Container {{ $labels.container }} in pod {{ $labels.pod }} is using more than 80% of its memory limit for 10 minutes.
            summary: Home Assistant container memory usage is high.
          expr: |
            (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  job="kubelet",
                  metrics_path="/metrics/resource",
                  namespace="homeassistant",
                  container=~"homeassistant|matter-server"
                }
              )
              /
              on (namespace, pod, container)
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{
                  job="kube-state-metrics",
                  namespace="homeassistant",
                  resource="memory",
                  unit="byte"
                }
              )
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            scope: homelab-apps
        - alert: HomelabAppNoReadyPods
          record: ""
          annotations:
            description: App {{ if $labels.label_app_kubernetes_io_name }}{{ $labels.label_app_kubernetes_io_name }}{{ else }}{{ $labels.label_app }}{{ end }} in namespace {{ $labels.namespace }} has no ready pods for longer than 10 minutes.
            summary: Homelab app has no ready pods.
          expr: |
            sum by (namespace, cluster, label_app, label_app_kubernetes_io_name) (
              max by (namespace, pod, cluster) (
                kube_pod_status_ready{
                  condition="true",
                  job="kube-state-metrics"
                }
              )
              * on (namespace, pod, cluster) group_left(label_app, label_app_kubernetes_io_name)
              kube_pod_labels{
                job="kube-state-metrics",
                label_alerts_nidr0x_win_enabled="true"
              }
            ) < 1
          for: 10m
          labels:
            severity: critical
            scope: homelab-apps
        - alert: HomelabAppCrashLooping
          record: ""
          annotations:
            description: App {{ if $labels.label_app_kubernetes_io_name }}{{ $labels.label_app_kubernetes_io_name }}{{ else }}{{ $labels.label_app }}{{ end }} in namespace {{ $labels.namespace }} has one or more pods crash looping for longer than 10 minutes.
            summary: Homelab app pod is crash looping.
          expr: |
            sum by (namespace, cluster, label_app, label_app_kubernetes_io_name) (
              max_over_time(
                kube_pod_container_status_waiting_reason{
                  job="kube-state-metrics",
                  reason="CrashLoopBackOff"
                }[5m]
              )
              * on (namespace, pod, cluster) group_left(label_app, label_app_kubernetes_io_name)
              kube_pod_labels{
                job="kube-state-metrics",
                label_alerts_nidr0x_win_enabled="true"
              }
            ) >= 1
          for: 10m
          labels:
            severity: critical
            scope: homelab-apps
        - alert: HomelabAppRestartsHigh
          record: ""
          annotations:
            description: App {{ if $labels.label_app_kubernetes_io_name }}{{ $labels.label_app_kubernetes_io_name }}{{ else }}{{ $labels.label_app }}{{ end }} in namespace {{ $labels.namespace }} has restarted more than 3 times in the last 30 minutes.
            summary: Homelab app pod is restarting repeatedly.
          expr: |
            sum by (namespace, cluster, label_app, label_app_kubernetes_io_name) (
              increase(
                kube_pod_container_status_restarts_total{
                  job="kube-state-metrics"
                }[30m]
              )
              * on (namespace, pod, cluster) group_left(label_app, label_app_kubernetes_io_name)
              kube_pod_labels{
                job="kube-state-metrics",
                label_alerts_nidr0x_win_enabled="true"
              }
            ) > 3
          for: 5m
          labels:
            severity: warning
            scope: homelab-apps
