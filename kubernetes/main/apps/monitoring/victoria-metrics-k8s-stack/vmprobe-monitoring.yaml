apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: monitoring-public-health
spec:
  jobName: monitoring-public-health
  interval: 60s
  scrapeTimeout: 10s
  module: http_2xx
  vmProberSpec:
    url: blackbox-exporter-prometheus-blackbox-exporter.kube-monitoring.svc:9115
  targets:
    static:
      targets:
        - https://monitoring.nidr0x.win/grafana/api/health
        - https://id.nidr0x.win/healthz
        - https://ha.nidr0x.win/
        - https://dns.nidr0x.win/
        - https://rss.nidr0x.win/
        - https://n8n.nidr0x.win/
        - https://tesla.nidr0x.win/
        - https://homebridge.nidr0x.win/
        - https://wallos.nidr0x.win/
        - https://argocd.nidr0x.win/
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: monitoring-public-health
spec:
  groups:
    - name: monitoring-public-health
      rules:
        - alert: MonitoringPublicEndpointUnavailable
          expr: |
            absent(probe_success{job="monitoring-public-health"})
            or
            min by (instance) (probe_success{job="monitoring-public-health"}) == 0
          for: 5m
          labels:
            severity: warning
            scope: observability
          annotations:
            description: Public endpoint {{ $labels.instance }} has failed HTTP probes for at least five minutes.
            summary: A public service endpoint is unavailable.
