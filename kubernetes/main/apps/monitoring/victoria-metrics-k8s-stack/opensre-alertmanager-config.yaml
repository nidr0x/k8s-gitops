apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: opensre
  namespace: kube-monitoring
  labels:
    alerts.nidr0x.win/alertmanager: primary
spec:
  route:
    receiver: opensre-webhook
    matchers:
      - severity=~"critical|warning"
    group_by:
      - alertname
      - namespace
      - pod
      - node
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
    continue: true
    routes:
      # Warnings are actionable but low-urgency: deliver them without
      # repeating as often as critical alerts.
      - receiver: opensre-webhook
        matchers:
          - severity="warning"
        repeat_interval: 12h
  receivers:
    - name: opensre-webhook
      webhook_configs:
        - url: http://192.168.1.209:9094/alertmanager
          send_resolved: true
          timeout: 10s
          http_config:
            bearer_token_secret:
              name: opensre-alertmanager-webhook
              key: token
