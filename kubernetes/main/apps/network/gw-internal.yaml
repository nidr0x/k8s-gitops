apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: gateway
  annotations:
    # The gateway-httproute source derives record targets from the parent
    # Gateway, not from the HTTPRoute. Without this override every hostname
    # attached here resolves to the private 192.168.1.221 address, which
    # Cloudflare rejects for proxied records.
    external-dns.alpha.kubernetes.io/target: ip.nidr0x.win
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.221
  listeners:
    - protocol: HTTPS
      port: 443
      name: https-gateway
      hostname: "*.nidr0x.win"
      tls:
        certificateRefs:
          # Read the certificate where cert-manager writes it. Cilium resolves
          # cross-namespace Secret references when a ReferenceGrant allows it,
          # so no copy has to be kept in sync in this namespace.
          - kind: Secret
            name: prod-cert-zerossl
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTPS
      port: 443
      name: https-domain-gateway
      hostname: nidr0x.win
      tls:
        certificateRefs:
          # Read the certificate where cert-manager writes it. Cilium resolves
          # cross-namespace Secret references when a ReferenceGrant allows it,
          # so no copy has to be kept in sync in this namespace.
          - kind: Secret
            name: prod-cert-zerossl
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
