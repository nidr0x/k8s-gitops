apiVersion: v1
kind: PersistentVolume
metadata:
  name: teslamate-mqtt-data-nfs4
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=4.1
    - tcp
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: teslamate-mqtt-data-nfs4
    volumeAttributes:
      server: 192.168.1.10
      share: /homelab/pvc-1daed4df-afde-49f5-9d04-32cafe180f87
