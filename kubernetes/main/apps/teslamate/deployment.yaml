apiVersion: apps/v1
kind: Deployment
metadata:
  name: teslamate
  namespace: teslamate
  labels:
    alerts.nidr0x.win/enabled: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: teslamate
  template:
    metadata:
      labels:
        app: teslamate
        alerts.nidr0x.win/enabled: "true"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: teslamate
          image: teslamate/teslamate:4.2.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 356Mi
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: teslamate
                  key: ENCRYPTION_KEY
            - name: DATABASE_USER
              value: postgres
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: teslamate-database-superuser
                  key: password
            - name: DATABASE_NAME
              value: teslamate
            - name: DATABASE_HOST
              value: teslamate-database-rw
            - name: DISABLE_MQTT
              value: "false"
            - name: MQTT_HOST
              value: teslamate-mqtt
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: teslamate-mqtt
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teslamate-mqtt
                  key: password
            - name: MQTT_HOME_ASSISTANT_DISCOVERY
              value: "true"
            - name: MQTT_HOME_ASSISTANT_DISCOVERY_URL
              value: https://tesla.nidr0x.win/
            - name: MQTT_HOME_ASSISTANT_DISCOVERY_PREFIX
              value: homeassistant
