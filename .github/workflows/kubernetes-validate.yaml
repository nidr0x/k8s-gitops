---
name: Kubernetes validation

on: # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: kubernetes-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up kubectl
        uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Test manifest renderer
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Render Argo CD sources and Kustomize builds
        id: render
        continue-on-error: true
        run: python .github/scripts/render_kubernetes.py --output "$RUNNER_TEMP/rendered.yaml" --github-output "$GITHUB_OUTPUT"

      - name: Validate rendered Kubernetes manifests
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP:/work:ro" \
            --workdir /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            -skip CustomResourceDefinition \
            -kubernetes-version "${{ steps.render.outputs.kubernetes_version }}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - name: Fail if any Helm source could not render
        if: steps.render.outcome == 'failure'
        run: exit 1
