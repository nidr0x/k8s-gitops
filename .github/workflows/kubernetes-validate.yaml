---
name: Kubernetes validation

on: # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: kubernetes-validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  argocd:
    name: Validate Argo CD manifests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Kubernetes object syntax
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            -kubernetes-version 1.37.2 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/apps \
            argocd/setup/argocd.yaml \
            argocd/argocd-apps.yaml \
            argocd/argocd-project-everest.yaml \
            argocd/argocd-setup.yaml \
            argocd/namespace.yaml \
            argocd/route/http-route.yaml

      - name: Check Argo CD source of truth
        run: |
          if grep -R -n --include='*.yaml' \
            'repoURL: https://github.com/nidr0x/homelab' \
            argocd/apps argocd/setup; then
            echo "Argo CD applications must use k8s-gitops as their source repository."
            exit 1
          fi

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kustomize
        run: |
          curl -sSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize

      - name: Render applications
        run: |
          set -euo pipefail
          : > rendered-manifests.yaml
          git ls-files 'kubernetes/**/kustomization.yaml' \
            | xargs -n1 dirname \
            | sort \
            | while IFS= read -r dir; do
                printf -- '---\n' >> rendered-manifests.yaml
                kustomize build "$dir" >> rendered-manifests.yaml
              done

      - name: Validate Kubernetes object syntax
        # VMProbe is skipped because the CRDs-catalog schema rejects the
        # `targets.static` field that the VictoriaMetrics operator accepts.
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --workdir /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -skip VMProbe \
            -kubernetes-version 1.37.2 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-manifests.yaml
