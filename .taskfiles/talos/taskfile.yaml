---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TOPF_CONFIG_FILE: "{{.ROOT_DIR}}/talos/topf.yaml"
  TOPF_RENDER_DIR: "{{.ROOT_DIR}}/talos/clusterconfig/topf"
  TOPF_SECRETS_FILE: "{{.ROOT_DIR}}/talos/talsecret.yaml"
  TALOSCONFIG: "{{.ROOT_DIR}}/talos/talosconfig"
  KUBECONFIG: "{{.ROOT_DIR}}/talos/kubeconfig"

env:
  TALOSCONFIG: "{{.TALOSCONFIG}}"

tasks:
  bootstrap-controlplane:
    desc: Bootstrap the Talos control plane on one node [BOOTSTRAP_NODE=controlplane-01]
    cmd: talosctl --nodes {{.BOOTSTRAP_IP}} --endpoints {{.BOOTSTRAP_IP}} bootstrap
    vars:
      BOOTSTRAP_NODE: '{{.BOOTSTRAP_NODE | default "controlplane-01"}}'
      BOOTSTRAP_IP:
        sh: yq '.nodes[] | select(.host == "{{.BOOTSTRAP_NODE}}") | .ip' {{.TOPF_CONFIG_FILE}}
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - talosctl --nodes {{.BOOTSTRAP_IP}} get machineconfig
      - which talosctl yq

  kubeconfig:
    desc: Download kubeconfig from one Talos control-plane node [BOOTSTRAP_NODE=controlplane-01]
    cmd: |
      talosctl kubeconfig {{.KUBECONFIG}} --nodes {{.BOOTSTRAP_IP}} --endpoints {{.BOOTSTRAP_IP}} --force --merge=false
      chmod 600 {{.KUBECONFIG}}
    vars:
      BOOTSTRAP_NODE: '{{.BOOTSTRAP_NODE | default "controlplane-01"}}'
      BOOTSTRAP_IP:
        sh: yq -r '.nodes[] | select(.host == "{{.BOOTSTRAP_NODE}}") | .ip' {{.TOPF_CONFIG_FILE}}
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which talosctl
      - which yq

  apply-all-bootstrap:
    desc: Apply generated Talos configs to all nodes for a fresh bootstrap
    cmd: topf --topfconfig {{.TOPF_CONFIG_FILE}} apply --auto-bootstrap --max-parallel=1
    preconditions:
      - test -f {{.TOPF_CONFIG_FILE}}
      - test -f {{.TOPF_SECRETS_FILE}}
      - which topf

  reset-node:
    desc: Reset Talos on a single node [CLUSTER=main] [HOSTNAME=required]
    prompt: Reset Talos node '{{.HOSTNAME}}' on the '{{.CLUSTER}}' cluster ... continue?
    cmd: talosctl reset --nodes {{.HOSTNAME}} --graceful=false
    requires:
      vars: [CLUSTER, HOSTNAME]
    preconditions:
      - talosctl --nodes {{.HOSTNAME}} get machineconfig
      - talosctl config info

  generate-config:
    desc: Render Talos machine configurations with TOPF
    cmd: topf --topfconfig {{.TOPF_CONFIG_FILE}} render --output {{.TOPF_RENDER_DIR}}
    preconditions:
      - test -f {{.TOPF_CONFIG_FILE}}
      - test -f {{.TOPF_SECRETS_FILE}}
      - test -f {{.SOPS_CONFIG_FILE}}
      - which topf sops

  generate-talosconfig:
    desc: Generate the Talos client configuration with TOPF
    cmd: |
      topf --topfconfig {{.TOPF_CONFIG_FILE}} talosconfig > {{.TALOSCONFIG}}
      chmod 600 {{.TALOSCONFIG}}
    preconditions:
      - test -f {{.TOPF_CONFIG_FILE}}
      - test -f {{.TOPF_SECRETS_FILE}}
      - test -f {{.SOPS_CONFIG_FILE}}
      - which topf sops

  apply-node:
    desc: Apply Talos config to a node [HOSTNAME=required]
    cmd: topf --topfconfig {{.TOPF_CONFIG_FILE}} --nodes-filter '^{{.HOSTNAME}}$' apply --mode={{.MODE}} --max-parallel=1
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [HOSTNAME]
    preconditions:
      - test -f {{.TOPF_CONFIG_FILE}}
      - test -f {{.TOPF_SECRETS_FILE}}
      - which topf

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    cmds:
      - |
        TALOS_VERSION=$(yq '.talosVersion' {{.TOPF_CONFIG_FILE}})
        NODE_NAME=$(kubectl get nodes -o jsonpath='{range .items[*]}{@.status.addresses[?(@.type=="InternalIP")].address}{"\t"}{@.metadata.name}{"\n"}{end}' | grep "^{{.IP}}" | cut -f2)
        TALOS_SCHEMATIC_ID=$(kubectl get node ${NODE_NAME} --output=jsonpath='{.metadata.annotations.extensions\.talos\.dev/schematic}')
        TALOS_SECUREBOOT=$(talosctl --nodes {{.IP}} get securitystate --output=jsonpath='{.spec.secureBoot}')
        SECURE_BOOT_SUFFIX=""
        if [ "$TALOS_SECUREBOOT" = "true" ]; then
          SECURE_BOOT_SUFFIX="-secureboot"
        fi
        talosctl --nodes {{.IP}} upgrade --image="factory.talos.dev/installer${SECURE_BOOT_SUFFIX}/${TALOS_SCHEMATIC_ID}:${TALOS_VERSION}" --timeout=10m
      - talosctl --nodes {{.IP}} health --wait-timeout=10m --server=false
    requires:
      vars: [IP]
    preconditions:
      - curl -fsSL -o /dev/null --fail https://github.com/siderolabs/talos/releases/tag/v$(yq '.talosVersion' {{.TOPF_CONFIG_FILE}} | sed 's/^v//')
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talosctl yq

  upgrade-k8s:
    desc: Upgrade Kubernetes
    cmd: talosctl --nodes {{.KUBERNETES_CONTROLLER}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      KUBERNETES_CONTROLLER:
        sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TOPF_CONFIG_FILE}}
    preconditions:
      - curl -fsSL -o /dev/null --fail https://github.com/siderolabs/kubelet/releases/tag/{{.KUBERNETES_VERSION}}
      - talosctl --nodes {{.KUBERNETES_CONTROLLER}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reboot-node:
    desc: Reboot Talos on a single node [CLUSTER=main] [IP=required] [MODE=default]
    cmds:
      - task: down
      - talosctl --nodes {{.IP}} reboot --mode={{.MODE}}
      - talosctl --nodes {{.IP}} health --wait-timeout=10m --server=false
      - task: up
    vars:
      MODE: '{{.MODE | default "default"}}'
    requires:
      vars: [CLUSTER, IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.CLUSTER_DIR}}/cluster.env
      - test -f {{.TALOSCONFIG}}
      - which talosctl
