apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
spec:
  destination:
    namespace: kube-monitoring
    server: https://kubernetes.default.svc
  project: everest
  sources:
    - repoURL: https://github.com/nidr0x/k8s-gitops
      targetRevision: master
      ref: nidr0x-k8s-gitops
    - repoURL: https://github.com/nidr0x/k8s-gitops
      targetRevision: master
      path: kubernetes/main/apps/monitoring/blackbox-exporter/
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 11.18.0
      chart: prometheus-blackbox-exporter
      helm:
        releaseName: blackbox-exporter
        valueFiles:
          - $nidr0x-k8s-gitops/kubernetes/main/apps/monitoring/blackbox-exporter/values.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
