apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api

  target:
    name: pocketid-oidc
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: clientID
      remoteRef:
        key: ARGOCD_OIDC_CLIENT_ID
    - secretKey: clientSecret
      remoteRef:
        key: ARGOCD_OIDC_CLIENT_SECRET
